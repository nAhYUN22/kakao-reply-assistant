[project]
name = "kakaoreply"
version = "0.1.0"
description = "Local synthetic KakaoReply simulator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "cryptography>=46,<51",
  "keyring>=25,<26",
  "mcp>=1.26,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
